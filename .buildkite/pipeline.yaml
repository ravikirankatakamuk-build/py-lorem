steps:
  - label: ":python: WSL - Generate sentence"
    key: "wsl-sentence"
    agents:
      queue: "wsl-local"

    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      echo "Generated sentence:"
      cat result.txt
      buildkite-agent annotate \
        --style "info" \
        --context "wsl-sentence-result" \
        < result.txt

    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true # to run bkt agent annotate cmd inside container
          propagate-uid-gid: true # same user inside the container as bkt agent runs outside the docker container, else they run as root 
          environment:
            - "HOME=/tmp"  # bkt agent user doesn't have perm to run inside .local, so /tmp was made a writable dir

  - label: ":python: WSL - Generate paragraph"
    key: "wsl-paragraph"
    depends_on: "wsl-sentence"
    agents:
      queue: "wsl-local"

    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      echo "Generated paragraph:"
      cat result2.txt
      buildkite-agent annotate \
        --style "success" \
        --context "wsl-paragraph-result" \
        < result2.txt
      echo "Uploading result2.txt as Buildkite artifact..." 
      buildkite-agent artifact upload "result2.txt"

    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true
          propagate-uid-gid: true
          environment:
            - "HOME=/tmp"
  
  - label: ":arrow_down: Download paragraph artifact"
    key: "download-artifact"
    depends_on: "wsl-paragraph"

    agents:
      queue: "wsl-local"

    command: |
      echo "Downloading result2.txt..."
      buildkite-agent artifact download "result2.txt" .

      echo "Downloaded artifact content:"
      cat result2.txt

      buildkite-agent annotate \
      --style "success" \
      --context "wsl-artifact-download" \
      "WSL artifact download completed successfully: result2.txt"        

  - label: ":aws: EC2 - Generate sentence"
    key: "ec2-sentence"
    agents:
      queue: "ec2-instance"

    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > ec2-result.txt
      echo "Generated sentence on EC2:"
      cat ec2-result.txt
      buildkite-agent annotate \
        --style "info" \
        --context "ec2-sentence-result" \
        < ec2-result.txt

    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true
          propagate-uid-gid: true
          environment:
            - "HOME=/tmp"

  - label: ":aws: EC2 - Generate paragraph"
    key: "ec2-paragraph"
    depends_on: "ec2-sentence"
    agents:
      queue: "ec2-instance"

    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > ec2-result2.txt
      echo "Generated paragraph on EC2:"
      cat ec2-result2.txt
      buildkite-agent annotate \
        --style "success" \
        --context "ec2-paragraph-result" \
        < ec2-result2.txt
      echo "Uploading ec2-result2.txt as Buildkite artifact..."
      buildkite-agent artifact upload "ec2-result2.txt"

    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true
          propagate-uid-gid: true
          environment:
            - "HOME=/tmp"

  - label: ":arrow_down: EC2 - Download paragraph artifact"
    key: "ec2-download-artifact"
    depends_on: "ec2-paragraph"

    agents:
      queue: "ec2-instance"

    command: |
      echo "Downloading ec2-result2.txt..."
      buildkite-agent artifact download "ec2-result2.txt" .

      echo "Downloaded EC2 artifact content:"
      cat ec2-result2.txt

      buildkite-agent annotate \
      --style "success" \
      --context "ec2-artifact-download" \
      "ec2 artifact download completed successfully: ec2-result2.txt"

  - label: ":docker: Build and push Docker image"
    key: "push-image"

    depends_on:
      - "download-artifact"
      - "ec2-download-artifact"

    agents:
      queue: "wsl-local"

    secrets:
      - PACKAGE_TOKEN_BUILDKITE

    command: |
      set -euo pipefail

      IMAGE_NAME="py-lorem"
      REGISTRY="packages.buildkite.com/ravi-buildkite/assessment-registry"
      TAG="$$BUILDKITE_BUILD_NUMBER"
      FULL_IMAGE="$$REGISTRY/$$IMAGE_NAME:$$TAG"

      echo "Building Docker image..."
      docker build -t "$$IMAGE_NAME:$$TAG" .

      echo "Tagging Docker image..."
      docker tag "$$IMAGE_NAME:$$TAG" "$$FULL_IMAGE"

      echo "Logging in to Buildkite Package Registry..."
      echo "$$PACKAGE_TOKEN_BUILDKITE" | docker login \
        packages.buildkite.com/ravi-buildkite/assessment-registry \
        --username buildkite \
        --password-stdin

      echo "Pushing Docker image..."
      docker push "$$FULL_IMAGE"

      echo "Successfully pushed: $$FULL_IMAGE"

      buildkite-agent annotate \
        --style "success" \
        --context "package-registry-push" \
        "Docker image successfully pushed to Buildkite Package Registry: $$IMAGE_NAME:$$TAG" 