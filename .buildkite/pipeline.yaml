agents:
    queue: "wsl-local" #que name
steps:
  - label: ":python: Generate sentence"
    key: "sentence"
    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      echo "Generated sentence:"
      cat result.txt
      buildkite-agent annotate --style "info" --context "sentence-result" < result.txt
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true   # annotation CLI works
          propagate-uid-gid: true       # no root-owned workspace files
          environment:                  # pip has writable HOME
            - "HOME=/tmp"

  - label: ":python: Generate paragraph"
    key: "paragraph"
    depends_on: "sentence"
    command: |
      pip install -e .
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      echo "Generated paragraph:"
      cat result2.txt
      buildkite-agent annotate --style "success" --context "paragraph-result" < result2.txt
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true   # annotation CLI works
          propagate-uid-gid: true       # no root-owned workspace files
          environment:                  # pip has writable HOME
            - "HOME=/tmp"

  - label: ":aws: EC2 Agent Test"
    key: "ec2-test"
    agents:
      queue: "ec2-instance"

    command: |
      echo "Running on:"
      hostname

      echo "Current user:"
      whoami

      echo "Python:"
      python --version

    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          propagate-uid-gid: true
          environment:
            - "HOME=/tmp"          
            